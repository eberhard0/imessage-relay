name: Bridge

# Builds imsg-bridge for Apple silicon (pure Go, no cgo; the Go linker ad-hoc
# signs darwin/arm64 binaries). Every v* tag attaches it to the GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['bridge/**', '.github/workflows/bridge.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        working-directory: bridge
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go mod tidy
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="dev-${GITHUB_SHA::7}"
          go vet ./...
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o imsg-bridge .
          file imsg-bridge
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: imsg-bridge
          retention-days: 7
          path: bridge/imsg-bridge
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: bridge/imsg-bridge
